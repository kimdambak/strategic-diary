<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전략 일기장</title>
  <meta name="description" content="세상의 변화를 보고, 나의 상태를 옮기는 따뜻한 전략 일기장">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <p class="date" id="date"></p>
      <h1>전략 일기장</h1>
      <p class="hello" id="hello"></p>
    </header>

    <nav class="tabs" id="tabs" aria-label="화면 이동">
      <button data-tab="today" class="on">오늘</button>
      <button data-tab="state">나의 상태</button>
      <button data-tab="world">세상</button>
      <button data-tab="learn">배움</button>
      <button data-tab="log">기록</button>
    </nav>

    <main id="main" aria-live="polite"></main>

    <footer class="foot">
      <p>기록은 이 브라우저에만 저장돼요. 소중한 기록은 <strong>기록</strong> 탭에서 내려받아 저장소에 올려 두세요.</p>
    </footer>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
